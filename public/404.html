<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d1117" />
  <title>404 — Irfan Ali</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem;
      background: radial-gradient(ellipse 70% 50% at 50% 0%, rgba(57,211,83,.12), transparent 70%), #0d1117;
      color: #e6edf3; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .wrap { max-width: 460px; text-align: left; }
    .label { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: .72rem; color: #39d353; letter-spacing: .08em; }
    h1 { margin: .7rem 0 .4rem; font-size: clamp(3rem, 12vw, 5rem); line-height: 1; letter-spacing: -.05em;
         background: linear-gradient(105deg, #f0f6fc, #46ef63); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { color: #8b949e; font-size: .92rem; line-height: 1.75; margin: 0 0 1rem; }
    code { padding: .12rem .35rem; border: 1px solid #21262d; border-radius: 4px; background: #010409;
           font-family: "JetBrains Mono", ui-monospace, monospace; font-size: .76rem; color: #46ef63; }
    a { display: inline-flex; align-items: center; gap: .4rem; margin-top: .6rem; padding: .6rem 1rem;
        border: 1px solid #39d353; border-radius: 7px; background: #39d353; color: #04140a;
        font-family: "JetBrains Mono", ui-monospace, monospace; font-size: .72rem; font-weight: 600;
        text-decoration: none; transition: background .2s ease, transform .18s ease; }
    a:hover { background: #46ef63; transform: translateY(-1px); }
    .divider { width: 54px; height: 3px; margin: 1rem 0 1.4rem; border-radius: 2px;
               background: linear-gradient(90deg, #39d353, rgba(57,211,83,0)); }
    .bottom { margin-top: 2rem; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: .6rem; color: #6e7681; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="label">// 404. not found</div>
    <h1>Lost in the cluster.</h1>
    <div class="divider"></div>
    <p>This path does not exist. The page may have moved, or the route was never deployed.</p>
    <p><code>kubectl get pages -n portfolio</code></p>
    <a href="/">← Back to the homepage</a>
    <div class="bottom">irfanjat.online</div>
  </main>
</body>
</html>
