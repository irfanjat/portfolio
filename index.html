    <meta name="theme-color" content="#ffffff" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('portfolio-theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
        } catch (e) {
          t = 'light'
        }
        document.documentElement.setAttribute('data-theme', t)
      })()
    </script>
